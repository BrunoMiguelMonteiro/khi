[package]
name = "khi-mcp"
version = "1.3.0"
description = "Read-only MCP server over the Khi Library"
edition = "2021"

[dependencies]
khi = { path = ".." }

# Turns the evaluation Library builder on for every `cargo test --workspace`.
[dev-dependencies]
khi = { path = "..", features = ["eval-fixture"] }
