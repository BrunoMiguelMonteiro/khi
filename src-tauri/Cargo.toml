[package]
name = "khi"
version = "2.0.0"
description = "A macOS app to export Kobo highlights to Markdown"
authors = ["you"]
edition = "2021"

[lib]
name = "khi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
unicode-normalization = "0.1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
zip = "0.6"
image = "0.24"
sha2 = "0.10"
notify = "6.0"
regex = "1.10"
dirs = "6.0.0"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
tauri-specta = { version = "=2.0.0-rc.28", features = ["derive", "typescript"] }

# System accent colour (src/system_accent.rs) and the traffic lights (src/window.rs): the versions Tauri already brings in Cargo.lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSString", "NSUserDefaults", "NSNotification", "NSObject", "NSOperation", "NSDictionary", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSColor", "NSColorSpace", "NSAppearance", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton"] }

[dev-dependencies]
tempfile = "3.10"
mockall = "0.12"

[profile.release.build-override]
strip = false
